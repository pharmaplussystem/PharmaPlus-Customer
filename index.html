<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6bcb"><link rel="manifest" href="manifest.json"><title>PharmaPlus Customer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#f4f8fc;--card:#fff;--text:#142033;--muted:#64748b;--primary:#0b6bcb;--border:#dbe5ef;--danger:#c62828;--shadow:0 12px 35px #17324d18}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#0e1722;--card:#162331;--text:#eef5fb;--muted:#9eb0c1;--border:#2a3a4b;--shadow:0 12px 35px #0005}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px}.primary{background:var(--primary);color:#fff}.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.danger{background:#fff0f0;color:var(--danger);border:1px solid #f3c2c2}.hidden{display:none!important}.screen{min-height:100vh}.landing{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top,#dff1ff,transparent 50%),var(--bg)}.welcome{width:min(460px,100%);text-align:center}.logo{width:76px;height:76px;border-radius:22px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:40px;margin:0 auto 18px;box-shadow:var(--shadow)}h1{margin:0 0 8px}.muted{color:var(--muted)}.welcome .actions{display:grid;gap:12px;margin-top:28px}.welcome button{width:100%;font-size:16px;padding:14px}.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;color:var(--primary)}.top-actions{display:flex;gap:8px}.wrap{width:min(1100px,100%);margin:auto;padding:20px}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.product{border:1px solid var(--border);border-radius:13px;padding:14px}.price{font-weight:800;color:var(--primary)}.search{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);margin-bottom:14px}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.qty{display:flex;align-items:center;gap:6px}.qty button{padding:5px 9px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.form{display:grid;gap:11px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text)}.row{display:flex;gap:10px}.row>*{flex:1}.status{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7f1ff;color:var(--primary);font-size:12px}.order{border:1px solid var(--border);border-radius:12px;padding:13px;margin:10px 0}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{padding:10px 12px}.wrap{padding:12px}.top-actions button{padding:9px}.row{flex-direction:column}}
</style></head><body>
<div id="landing" class="screen landing"><div class="welcome"><div class="logo">💊</div><h1>PharmaPlus</h1><p class="muted">Customer Portal</p><p>Shop medicines from your pharmacy and track your orders.</p><div class="actions"><button class="primary" onclick="openAuth('login')">🔐 Log In</button><button class="ghost" onclick="openAuth('signup')">📝 Create Account</button></div></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand">💊 PharmaPlus</div><div class="top-actions"><button class="ghost" onclick="openAccount()">👤 Account</button><button class="ghost" onclick="toggleTheme()">🌙 Theme</button><button class="danger" onclick="logout()">↪ Logout</button></div></header><main class="wrap"><div class="grid"><section class="card"><h2>Shop Medicines</h2><select id="pharmacy" class="search" onchange="changePharmacy()"></select><input id="search" class="search" placeholder="Enter medicine name or brand..." oninput="renderCatalog()"><div id="catalog" class="catalog"></div></section><aside class="card"><h2>🛒 Cart</h2><div id="cart"></div><div class="row"><button class="primary" onclick="openCheckout()">Checkout</button><button class="ghost" onclick="clearCart()">Clear</button></div></aside></div><section class="card" style="margin-top:18px"><h2>📦 My Orders</h2><div id="orders"></div></section></main></div>
<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Account</h2><button class="ghost" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
let sb,session=null,customer=null,pharmacies=[],products=[],cart=[],authMode='login',selectedPharmacy=null;const $=id=>document.getElementById(id);function cfg(){return window.PHARMAPLUS_SUPABASE_URL&&window.PHARMAPLUS_SUPABASE_KEY&&!window.PHARMAPLUS_SUPABASE_URL.includes('PASTE_YOUR')?{url:window.PHARMAPLUS_SUPABASE_URL,key:window.PHARMAPLUS_SUPABASE_KEY}:null}function connect(){const c=cfg();if(!c){alert('Open config.js and enter your Supabase Project URL and Publishable/anon key.');return false}if(!sb)sb=supabase.createClient(c.url,c.key);return true}
function openAuth(mode){authMode=mode;$('modalTitle').textContent=mode==='login'?'Log In':'Create Customer Account';$('modalBody').innerHTML=mode==='login'?`<form class="form" onsubmit="login(event)"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><div class="row"><button class="primary">Log In</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div><button type="button" class="ghost" onclick="openAuth('signup')">First time? Create Account</button></form>`:`<form class="form" onsubmit="signup(event)"><label>Full Name</label><input id="name" required><label>Phone</label><input id="phone" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><label>Confirm Password</label><input id="confirm" type="password" minlength="6" required><label>Pharmacy</label><select id="pharm" required><option value="">Select pharmacy</option></select><div class="row"><button class="primary">Create Account</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div><button type="button" class="ghost" onclick="openAuth('login')">Already have an account? Log In</button></form>`;$('modal').classList.remove('hidden');if(mode==='signup')loadPharmacies('pharm')}
async function loadPharmacies(target){if(!connect())return;const r=await sb.rpc('get_online_pharmacies');if(r.error){alert(r.error.message);return}pharmacies=r.data||[];const el=$(target);if(el)el.innerHTML='<option value="">Select pharmacy</option>'+pharmacies.map(p=>`<option value="${p.id}">${esc(p.name)}${p.location?' — '+esc(p.location):''}</option>`).join('')}
async function signup(e){e.preventDefault();if(!connect())return;if($('password').value!==$('confirm').value)return alert('Passwords do not match.');const meta={account_type:'customer',full_name:$('name').value.trim(),phone:$('phone').value.trim(),pharmacy_id:$('pharm').value};if(!meta.pharmacy_id)return alert('Select a pharmacy.');const r=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:meta}});if(r.error)return alert(r.error.message);if(!r.data.session){closeModal();return alert('Account created. Please confirm your email if email confirmation is enabled, then log in.')}await finishLogin(r.data.session)}
async function login(e){e.preventDefault();if(!connect())return;const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return alert(r.error.message);await finishLogin(r.data.session)}
async function finishLogin(s){session=s;const r=await sb.from('customer_profiles').select('*').eq('id',session.user.id).maybeSingle();if(r.error||!r.data){await sb.auth.signOut();return alert('Customer profile was not created. Run the latest online-ordering SQL in your Supabase project, then create the account again.')}customer=r.data;selectedPharmacy=customer.pharmacy_id;localStorage.setItem('pp_customer_pharmacy',selectedPharmacy);closeModal();$('landing').classList.add('hidden');$('app').classList.remove('hidden');await loadPharmacies('pharmacy');$('pharmacy').value=selectedPharmacy;await loadCatalog();await loadOrders()}
async function init(){if(!connect())return;const r=await sb.auth.getSession();if(r.data.session){await finishLogin(r.data.session)}}
async function loadCatalog(){if(!connect()||!selectedPharmacy)return;const r=await sb.rpc('get_online_catalog',{p_pharmacy:selectedPharmacy});if(r.error)return alert(r.error.message);products=r.data||[];renderCatalog();renderCart()}
function renderCatalog(){const q=($('search')?.value||'').toLowerCase();const list=products.filter(p=>(p.generic_name+' '+(p.brand_name||'')).toLowerCase().includes(q));$('catalog').innerHTML=list.length?list.map(p=>`<div class="product"><b>${esc(p.generic_name)}</b>${p.brand_name?`<div class="muted">${esc(p.brand_name)}</div>`:''}<p class="price">USh ${Number(p.retail_price||0).toLocaleString()}</p><div class="muted">Stock: ${p.qty}</div><button class="primary" style="margin-top:10px;width:100%" onclick="add(${JSON.stringify(p.id)})">Add to cart</button></div>`).join(''):'<div class="empty">No medicines found.</div>'}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(i=>i.id===id);if(x){if(x.qty<p.qty)x.qty++;else return alert('Not enough stock.')}else cart.push({id,qty:1});renderCart()};function renderCart(){$('cart').innerHTML=cart.length?cart.map(i=>{const p=products.find(x=>x.id===i.id);return `<div class="cartrow"><div><b>${esc(p.generic_name)}</b><div>USh ${Number(p.retail_price).toLocaleString()} × ${i.qty}</div></div><div class="qty"><button class="ghost" onclick="chg('${i.id}',-1)">−</button><b>${i.qty}</b><button class="ghost" onclick="chg('${i.id}',1)">+</button></div></div>`}).join('')+'<h3>Total: USh '+total().toLocaleString()+'</h3>':'<div class="empty">Your cart is empty.</div>'};function chg(id,n){const i=cart.find(x=>x.id===id),p=products.find(x=>x.id===id);if(!i)return;i.qty+=n;if(i.qty>p.qty)i.qty=p.qty;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart()};function total(){return cart.reduce((a,i)=>{const p=products.find(x=>x.id===i.id);return a+Number(p.retail_price)*i.qty},0)}function clearCart(){cart=[];renderCart()}
function openCheckout(){if(!cart.length)return alert('Your cart is empty.');$('modalTitle').textContent='Confirm Order';$('modalBody').innerHTML=`<form class="form" onsubmit="placeOrder(event)"><label>Fulfillment</label><select id="fulfillment"><option value="delivery">Delivery</option><option value="pickup">Pickup</option></select><label>Delivery Address</label><textarea id="address" rows="3" placeholder="Enter delivery address"></textarea><label>Phone</label><input id="orderPhone" value="${esc(customer.phone||'')}"><label>Notes</label><textarea id="notes" rows="2"></textarea><p><b>Total: USh ${total().toLocaleString()}</b></p><div class="row"><button class="primary">Place Order</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div></form>`;$('modal').classList.remove('hidden')}
async function placeOrder(e){e.preventDefault();if(!connect())return;const items=cart.map(i=>({product_id:i.id,qty:i.qty}));const r=await sb.rpc('place_online_order',{p_pharmacy:selectedPharmacy,p_fulfillment:$('fulfillment').value,p_delivery_address:$('address').value.trim(),p_phone:$('orderPhone').value.trim(),p_notes:$('notes').value.trim(),p_items:items});if(r.error)return alert(r.error.message);clearCart();closeModal();await loadOrders();alert('Order placed successfully.');}
async function loadOrders(){const r=await sb.from('online_orders').select('*').eq('customer_id',session.user.id).order('created_at',{ascending:false});if(r.error)return;const arr=r.data||[];$('orders').innerHTML=arr.length?arr.map(o=>`<div class="order"><b>${esc(o.order_number)}</b> <span class="status">${esc(o.status.replaceAll('_',' '))}</span><div class="muted">${new Date(o.created_at).toLocaleString()} · ${esc(o.fulfillment)}</div><strong>USh ${Number(o.total).toLocaleString()}</strong></div>`).join(''):'<div class="empty">No orders yet.</div>'}
function openAccount(){if(!customer)return;openCustom('My Account',`<form class="form" onsubmit="saveAccount(event)"><label>Full Name</label><input id="aName" value="${esc(customer.full_name||'')}"><label>Phone</label><input id="aPhone" value="${esc(customer.phone||'')}"><label>Address</label><textarea id="aAddress">${esc(customer.address||'')}</textarea><div class="row"><button class="primary">Save</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div></form>`)}function openCustom(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.remove('hidden')}async function saveAccount(e){e.preventDefault();const r=await sb.from('customer_profiles').update({full_name:$('aName').value.trim(),phone:$('aPhone').value.trim(),address:$('aAddress').value.trim(),updated_at:new Date().toISOString()}).eq('id',session.user.id);if(r.error)return alert(r.error.message);customer={...customer,full_name:$('aName').value.trim(),phone:$('aPhone').value.trim(),address:$('aAddress').value.trim()};closeModal();alert('Account updated.')}
async function logout(){if(!confirm('Log out of PharmaPlus?'))return;await sb.auth.signOut();session=customer=null;cart=[];$('app').classList.add('hidden');$('landing').classList.remove('hidden')};function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('pp_theme',document.body.classList.contains('dark')?'dark':'light')};function changePharmacy(){selectedPharmacy=$('pharmacy').value;loadCatalog()};function closeModal(){$('modal').classList.add('hidden');$('modalBody').innerHTML=''}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}if(localStorage.getItem('pp_theme')==='dark')document.body.classList.add('dark');init();
</script></body></html>
