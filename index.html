<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6bcb"><link rel="manifest" href="manifest.json"><title>PharmaPlus Customer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#f4f8fc;--card:#fff;--text:#142033;--muted:#64748b;--primary:#0b6bcb;--border:#dbe5ef;--danger:#c62828;--success:#15803d;--shadow:0 10px 28px #17324d18}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#0e1722;--card:#162331;--text:#eef5fb;--muted:#9eb0c1;--border:#2a3a4b;--shadow:0 10px 28px #0005}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px}.primary{background:var(--primary);color:#fff}.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.danger{background:#fff0f0;color:var(--danger);border:1px solid #f3c2c2}.hidden{display:none!important}.landing{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top,#dff1ff,transparent 50%),var(--bg)}.welcome{width:min(460px,100%);text-align:center}.logo{width:76px;height:76px;border-radius:22px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:40px;margin:0 auto 18px;box-shadow:var(--shadow)}h1{margin:0 0 8px}.muted{color:var(--muted)}.actions{display:grid;gap:12px;margin-top:28px}.actions button{width:100%;font-size:16px;padding:14px}.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:11px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:var(--primary)}.top-actions{display:flex;gap:7px;align-items:center}.cartBtn{position:relative}.badge{position:absolute;top:-6px;right:-5px;background:#dc2626;color:#fff;border-radius:99px;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center}.wrap{width:min(1250px,100%);margin:auto;padding:18px}.layout{display:grid;grid-template-columns:245px 1fr;gap:16px}.side{position:sticky;top:76px;height:max-content}.side button{width:100%;text-align:left;margin:4px 0}.side .active{background:#e7f1ff;color:var(--primary);font-weight:800}.main{min-width:0}.shopgrid{display:grid;grid-template-columns:1fr 330px;gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.search{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);margin-bottom:10px}.suggestions{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}.suggestion{padding:11px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;gap:12px}.suggestion:last-child{border-bottom:0}.suggestion:hover{background:#eef6ff}.suggest-stock{font-size:12px;color:var(--success);white-space:nowrap}.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.product{border:1px solid var(--border);border-radius:13px;padding:14px}.price{font-weight:800;color:var(--primary)}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.qty{display:flex;align-items:center;gap:6px}.qty button{padding:5px 9px}.status{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7f1ff;color:var(--primary);font-size:12px;text-transform:capitalize}.status.pending{background:#fff7d6;color:#946200}.status.rejected{background:#ffe8e8;color:#b42318}.status.complete,.status.delivered{background:#e7f8ed;color:#16733a}.order{border:1px solid var(--border);border-radius:12px;padding:13px;margin:10px 0;cursor:pointer}.order:hover{border-color:var(--primary)}.timeline{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.step{padding:7px 9px;border-radius:99px;background:var(--border);font-size:12px}.step.done{background:#dff3e6;color:#176b35;font-weight:700}.step.current{background:#dbeeff;color:#075ea8;font-weight:800}.form{display:grid;gap:11px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text)}.row{display:flex;gap:10px}.row>*{flex:1}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:30}.modalbox{width:min(600px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.empty{text-align:center;padding:30px;color:var(--muted)}.cartPanel{position:fixed;right:16px;top:70px;width:min(390px,calc(100% - 32px));max-height:80vh;overflow:auto;z-index:25;display:none}.cartPanel.open{display:block}.mapbox{border:1px dashed var(--border);padding:12px;border-radius:10px}.paybox{border:1px solid var(--border);border-radius:12px;padding:13px}.notice{padding:10px;border-radius:10px;background:#fff8dc;color:#765b00;font-size:13px}.successbox{padding:10px;border-radius:10px;background:#eaf8ef;color:#176b35;font-size:13px}.left-title{font-weight:800;margin:0 0 8px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:6px}.side button{width:auto;white-space:nowrap}.shopgrid{grid-template-columns:1fr}.cartPanel{top:64px}}@media(max-width:600px){.top-actions button{padding:8px}.top-actions .label{display:none}.wrap{padding:10px}.catalog{grid-template-columns:1fr 1fr}.row{flex-direction:column}}
</style></head><body>
<div id="landing" class="landing"><div class="welcome"><div class="logo">💊</div><h1>PharmaPlus</h1><p class="muted">Customer Portal</p><p>Order medicines from your pharmacy and follow every stage of your order.</p><div class="actions"><button class="primary" onclick="openAuth('login')">🔐 Log In</button><button class="ghost" onclick="openAuth('signup')">📝 Create Account</button></div></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand">💊 PharmaPlus</div><div class="top-actions"><button class="ghost" onclick="openAccount()">👤 <span class="label">Account</span></button><button class="ghost" onclick="toggleTheme()">🌙 <span class="label">Theme</span></button><button class="ghost cartBtn" onclick="toggleCart()">🛒 <span class="label">Cart</span><span id="cartBadge" class="badge">0</span></button><button class="danger" onclick="logout()">↪ <span class="label">Logout</span></button></div></header>
<main class="wrap"><div class="layout"><aside class="side card"><p class="left-title">Customer Features</p><button id="shopNav" class="active" onclick="showSection('shop')">🛍️ Shop Medicines</button><button onclick="showSection('orders')">📦 My Orders <span id="orderCount"></span></button><button onclick="openAccount()">👤 My Account</button><button onclick="toggleTheme()">🌙 Theme</button></aside>
<section class="main"><div id="shopSection"><div class="shopgrid"><section class="card"><h2>Shop Medicines</h2><select id="pharmacy" class="search" onchange="changePharmacy()"></select><div class="row"><select id="customerType" class="search" onchange="changeCustomerType()"><option value="retail">Retail Customer</option><option value="wholesale">Wholesale Customer</option></select></div><input id="search" class="search" placeholder="Enter medicine name or brand..." oninput="renderSuggestions()" autocomplete="off"><div id="suggestions" class="suggestions hidden"></div><div id="catalog" class="catalog"></div></section><aside class="card"><h2>🛒 Cart</h2><div id="cart"></div><button class="primary" style="width:100%;margin-top:10px" onclick="openCheckout()">Proceed to Order</button><button class="ghost" style="width:100%;margin-top:8px" onclick="clearCart()">Clear Cart</button></aside></div></div>
<div id="ordersSection" class="hidden"><section class="card"><h2>📦 My Orders</h2><p class="muted">Orders update automatically as the pharmacy changes their status.</p><div id="orders"></div></section></div></section></div></main></div>
<div id="cartPanel" class="card cartPanel"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Your Cart</h3><button class="ghost" onclick="toggleCart(false)">✕</button></div><div id="cartPanelBody"></div></div>
<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Account</h2><button class="ghost" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
let sb,session=null,customer=null,pharmacies=[],products=[],cart=[],authMode='login',selectedPharmacy=null,customerType='retail',ordersCache=[];const $=id=>document.getElementById(id);const statuses=['pending','sent','preparing','ready','out_for_delivery','delivered','complete'];
function cfg(){return window.PHARMAPLUS_SUPABASE_URL&&window.PHARMAPLUS_SUPABASE_KEY&&!window.PHARMAPLUS_SUPABASE_URL.includes('PASTE_YOUR')?{url:window.PHARMAPLUS_SUPABASE_URL,key:window.PHARMAPLUS_SUPABASE_KEY}:null}function connect(){const c=cfg();if(!c){alert('Open config.js and enter your Supabase Project URL and Publishable/anon key.');return false}if(!sb)sb=supabase.createClient(c.url,c.key);return true}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openAuth(mode){authMode=mode;$('modalTitle').textContent=mode==='login'?'Log In':'Create Customer Account';$('modalBody').innerHTML=mode==='login'?`<form class="form" onsubmit="login(event)"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><div class="row"><button class="primary">Log In</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div><button type="button" class="ghost" onclick="openAuth('signup')">First time? Create Account</button></form>`:`<form class="form" onsubmit="signup(event)"><label>Full Name</label><input id="name" required><label>Phone</label><input id="phone" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><label>Confirm Password</label><input id="confirm" type="password" minlength="6" required><label>Pharmacy</label><select id="pharm" required><option value="">Select pharmacy</option></select><div class="row"><button class="primary">Create Account</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div><button type="button" class="ghost" onclick="openAuth('login')">Already have an account? Log In</button></form>`;$('modal').classList.remove('hidden');if(mode==='signup')loadPharmacies('pharm')}
async function loadPharmacies(target){if(!connect())return;const r=await sb.rpc('get_online_pharmacies');if(r.error){alert(r.error.message);return}pharmacies=r.data||[];const el=$(target);if(el)el.innerHTML='<option value="">Select pharmacy</option>'+pharmacies.map(p=>`<option value="${p.id}">${esc(p.name)}${p.location?' — '+esc(p.location):''}</option>`).join('')}
async function signup(e){e.preventDefault();if(!connect())return;if($('password').value!==$('confirm').value)return alert('Passwords do not match.');const meta={account_type:'customer',full_name:$('name').value.trim(),phone:$('phone').value.trim(),pharmacy_id:$('pharm').value};if(!meta.pharmacy_id)return alert('Select a pharmacy.');const r=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:meta}});if(r.error)return alert(r.error.message);if(!r.data.session){closeModal();return alert('Account created. Confirm your email if required, then log in.')}await finishLogin(r.data.session)}
async function login(e){e.preventDefault();if(!connect())return;const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return alert(r.error.message);await finishLogin(r.data.session)}
async function finishLogin(s){session=s;const r=await sb.from('customer_profiles').select('*').eq('id',session.user.id).maybeSingle();if(r.error||!r.data){await sb.auth.signOut();return alert('Customer profile was not created. Run the customer-ordering SQL update, then create the account again.')}customer=r.data;selectedPharmacy=customer.pharmacy_id;localStorage.setItem('pp_customer_pharmacy',selectedPharmacy);closeModal();$('landing').classList.add('hidden');$('app').classList.remove('hidden');await loadPharmacies('pharmacy');$('pharmacy').value=selectedPharmacy;await loadCatalog();await loadOrders();startOrderRealtime()}
async function init(){if(!connect())return;const r=await sb.auth.getSession();if(r.data.session)await finishLogin(r.data.session)}
async function loadCatalog(){if(!connect()||!selectedPharmacy)return;const r=await sb.rpc('get_online_catalog',{p_pharmacy:selectedPharmacy});if(r.error)return alert(r.error.message);products=r.data||[];renderCatalog();renderCart()}
function priceFor(p){return Number(customerType==='wholesale'?p.wholesale_price:p.retail_price)||0}function changeCustomerType(){customerType=$('customerType').value;renderCatalog();renderSuggestions();renderCart()}
function renderSuggestions(){const q=($('search')?.value||'').trim().toLowerCase();const box=$('suggestions');if(!q){box.classList.add('hidden');box.innerHTML='';renderCatalog();return}const list=products.filter(p=>(p.generic_name+' '+(p.brand_name||'')).toLowerCase().includes(q)).slice(0,8);box.innerHTML=list.length?list.map(p=>`<div class="suggestion" onclick="selectSuggestion('${p.id}')"><div><b>${esc(p.generic_name)}</b>${p.brand_name?` <span class="muted">(${esc(p.brand_name)})</span>`:''}<div class="muted">USh ${priceFor(p).toLocaleString()} · ${customerType==='wholesale'?'Wholesale':'Retail'}</div></div><span class="suggest-stock">Stock: ${Number(p.qty)||0}</span></div>`).join(''):'<div class="empty">No matching medicine.</div>';box.classList.remove('hidden');renderCatalog(list)}
function selectSuggestion(id){$('search').value=products.find(p=>p.id===id)?.generic_name||'';renderSuggestions();add(id)}
function renderCatalog(list){if(!list) {const q=($('search')?.value||'').trim().toLowerCase();list=q?products.filter(p=>(p.generic_name+' '+(p.brand_name||'')).toLowerCase().includes(q)):products.slice(0,24)}$('catalog').innerHTML=list.length?list.map(p=>`<div class="product"><b>${esc(p.generic_name)}</b>${p.brand_name?`<div class="muted">${esc(p.brand_name)}</div>`:''}<p class="price">USh ${priceFor(p).toLocaleString()}</p><div class="muted">${customerType==='wholesale'?'Wholesale':'Retail'} price</div><button class="primary" style="margin-top:10px;width:100%" onclick="add('${p.id}')">Add to cart</button></div>`).join(''):'<div class="empty">Type the medicine you want to find.</div>'}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(i=>i.id===id);if(x){if(x.qty<p.qty)x.qty++;else return alert('Requested quantity is not available.')}else cart.push({id,qty:1});renderCart();toggleCart(true)}
function renderCart(){const html=cart.length?cart.map(i=>{const p=products.find(x=>x.id===i.id);if(!p)return '';return `<div class="cartrow"><div><b>${esc(p.generic_name)}</b><div class="muted">USh ${priceFor(p).toLocaleString()} × ${i.qty}</div></div><div class="qty"><button class="ghost" onclick="chg('${i.id}',-1)">−</button><b>${i.qty}</b><button class="ghost" onclick="chg('${i.id}',1)">+</button></div></div>`}).join('')+'<h3>Total: USh '+total().toLocaleString()+'</h3>':'<div class="empty">Your cart is empty.</div>';$('cart').innerHTML=html;$('cartPanelBody').innerHTML=html;$('cartBadge').textContent=cart.reduce((a,i)=>a+i.qty,0)}
function chg(id,n){const i=cart.find(x=>x.id===id),p=products.find(x=>x.id===id);if(!i||!p)return;i.qty+=n;if(i.qty>p.qty)i.qty=p.qty;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart()}function total(){return cart.reduce((a,i)=>{const p=products.find(x=>x.id===i.id);return a+(p?priceFor(p)*i.qty:0)},0)}function clearCart(){cart=[];renderCart()}function toggleCart(force){const panel=$('cartPanel');if(force===true)panel.classList.add('open');else if(force===false)panel.classList.remove('open');else panel.classList.toggle('open')}
function openCheckout(){if(!cart.length)return alert('Your cart is empty.');$('modalTitle').textContent='Order & Payment';$('modalBody').innerHTML=`<form class="form" onsubmit="submitPaidOrder(event)"><label>Customer Type</label><select id="checkoutType"><option value="retail" ${customerType==='retail'?'selected':''}>Retail</option><option value="wholesale" ${customerType==='wholesale'?'selected':''}>Wholesale</option></select><label>Fulfillment</label><select id="fulfillment" onchange="toggleDeliveryFields()"><option value="delivery">Delivery at Home</option><option value="pickup">Pickup</option></select><div id="deliveryFields"><label>Delivery address</label><textarea id="address" rows="2" placeholder="House/door address"></textarea><div class="mapbox"><b>📍 Live location</b><p class="muted">Allow location access so the delivery team can follow your location using Google Maps.</p><button type="button" class="ghost" onclick="getLocation()">Use My Live Location</button><div id="locationStatus" class="muted" style="margin-top:7px">Location not captured.</div></div></div><label>Phone</label><input id="orderPhone" value="${esc(customer.phone||'')}" required><label>Prescription (optional)</label><input id="prescription" type="file" accept="image/*,.pdf"><label>Order notes</label><textarea id="notes" rows="2" placeholder="Anything the pharmacist should know?"></textarea><div class="paybox"><h3 style="margin-top:0">💳 Payment</h3><label>Payment method</label><select id="payMethod" onchange="togglePaymentFields()"><option value="mobile_money">Mobile Money</option><option value="bank">Bank</option><option value="visa">Visa</option></select><div id="mobileFields"><label>Mobile network</label><select id="mobileNetwork"><option value="MTN">MTN</option><option value="Airtel">Airtel</option></select><label>Mobile money number</label><input id="mobileNumber" placeholder="07XXXXXXXX" inputmode="tel"></div><label>Transaction message / payment reference</label><textarea id="transactionMessage" rows="3" placeholder="Paste the payment confirmation SMS/message here" required></textarea><div class="notice">Your order is sent to the pharmacy only after you paste the payment transaction message/reference.</div></div><p><b>Order total: USh ${total().toLocaleString()}</b></p><div class="row"><button class="primary">Confirm Payment & Send Order</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div></form>`;$('modal').classList.remove('hidden');toggleDeliveryFields();togglePaymentFields()}
function toggleDeliveryFields(){const d=$('fulfillment')?.value==='delivery';$('deliveryFields')?.classList.toggle('hidden',!d)}function togglePaymentFields(){const m=$('payMethod')?.value==='mobile_money';$('mobileFields')?.classList.toggle('hidden',!m)}
async function getLocation(){if(!navigator.geolocation)return alert('Live location is not supported by this browser.');$('locationStatus').textContent='Getting your location…';navigator.geolocation.getCurrentPosition(pos=>{window.orderLocation={lat:pos.coords.latitude,lng:pos.coords.longitude};$('locationStatus').innerHTML=`Location captured. <a href="https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}" target="_blank" rel="noopener">Open Google Maps</a>`},()=>{$('locationStatus').textContent='Location permission was not granted.'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function uploadPrescription(file){if(!file)return null;const path=`${session.user.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('prescriptions').upload(path,file,{upsert:false});if(up.error)throw up.error;const pub=sb.storage.from('prescriptions').getPublicUrl(path);return pub.data.publicUrl}
async function submitPaidOrder(e){e.preventDefault();if(!connect())return;const type=$('checkoutType').value;customerType=type;$('customerType').value=type;const fulfillment=$('fulfillment').value;if(fulfillment==='delivery'&&!window.orderLocation)return alert('Please capture your live location for home delivery.');const tx=$('transactionMessage').value.trim();if(!tx)return alert('Paste the payment transaction message/reference before sending the order.');if($('payMethod').value==='mobile_money'&&!$('mobileNumber').value.trim())return alert('Enter the MTN or Airtel number used for payment.');let prescriptionUrl=null;try{prescriptionUrl=await uploadPrescription($('prescription').files[0])}catch(err){return alert('Prescription upload failed: '+err.message)}const items=cart.map(i=>({product_id:i.id,qty:i.qty}));const payment={method:$('payMethod').value,mobile_network:$('mobileNetwork')?.value||null,mobile_number:$('mobileNumber')?.value.trim()||null,transaction_message:tx};const r=await sb.rpc('place_online_order',{p_pharmacy:selectedPharmacy,p_fulfillment:fulfillment,p_delivery_address:fulfillment==='delivery'?$('address').value.trim():null,p_phone:$('orderPhone').value.trim(),p_notes:$('notes').value.trim(),p_items:items,p_customer_type:type,p_payment_method:payment.method,p_mobile_network:payment.mobile_network,p_mobile_number:payment.mobile_number,p_transaction_message:payment.transaction_message,p_prescription_url:prescriptionUrl,p_latitude:window.orderLocation?.lat||null,p_longitude:window.orderLocation?.lng||null});if(r.error)return alert(r.error.message);clearCart();window.orderLocation=null;closeModal();showSection('orders');await loadOrders();alert('Payment details received and order sent to the pharmacy.');}
async function loadOrders(){if(!session)return;const r=await sb.from('online_orders').select('*,online_order_items(*)').eq('customer_id',session.user.id).order('created_at',{ascending:false});if(r.error){console.warn(r.error.message);return}ordersCache=r.data||[];renderOrders()}
function labelStatus(s){return s.replaceAll('_',' ')}function renderOrders(){const arr=ordersCache;$('orderCount').textContent=arr.length?`(${arr.length})`:'';$('orders').innerHTML=arr.length?arr.map(o=>`<div class="order" onclick="openOrder('${o.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.order_number)}</b><span class="status ${o.status}">${esc(labelStatus(o.status))}</span></div><div class="muted">${new Date(o.created_at).toLocaleString()} · ${esc(o.fulfillment)}</div><strong>USh ${Number(o.total).toLocaleString()}</strong>${o.status==='rejected'&&o.rejection_reason?`<div class="notice" style="margin-top:8px">Reason: ${esc(o.rejection_reason)}. Please contact the pharmacist.</div>`:''}</div>`).join(''):'<div class="empty">No orders yet.</div>'}
async function openOrder(id){const o=ordersCache.find(x=>x.id===id);if(!o)return;let items=o.online_order_items||[];if(!items.length){const r=await sb.from('online_order_items').select('*').eq('order_id',id);items=r.data||[]}const idx=Math.max(0,statuses.indexOf(o.status));$('modalTitle').textContent=`Order ${o.order_number}`;$('modalBody').innerHTML=`<div><span class="status ${o.status}">${esc(labelStatus(o.status))}</span><div class="timeline">${statuses.map((s,i)=>`<span class="step ${i<idx?'done':''} ${i===idx?'current':''}">${esc(labelStatus(s))}</span>`).join('')}</div><h3>Order Details</h3>${items.map(i=>`<div class="cartrow"><div><b>${esc(i.product_name)}</b>${i.brand_name?`<div class="muted">${esc(i.brand_name)}</div>`:''}</div><div>${i.qty} × USh ${Number(i.unit_price).toLocaleString()}</div></div>`).join('')}<h3>Total: USh ${Number(o.total).toLocaleString()}</h3><p><b>Customer type:</b> ${esc(o.customer_type||'retail')}</p><p><b>Fulfillment:</b> ${esc(o.fulfillment)}</p>${o.delivery_address?`<p><b>Address:</b> ${esc(o.delivery_address)}</p>`:''}${o.latitude&&o.longitude?`<p><a href="https://www.google.com/maps?q=${o.latitude},${o.longitude}" target="_blank" rel="noopener">📍 Open delivery location in Google Maps</a></p>`:''}${o.prescription_url?`<p><a href="${esc(o.prescription_url)}" target="_blank" rel="noopener">📄 View uploaded prescription</a></p>`:''}${o.payment_method?`<p><b>Payment:</b> ${esc(o.payment_method)}${o.mobile_network?' · '+esc(o.mobile_network):''}</p>`:''}${o.rejection_reason?`<div class="notice"><b>Pharmacist rejection reason:</b> ${esc(o.rejection_reason)}<br>Please contact the pharmacist.</div>`:''}${o.status==='delivered'?`<div class="successbox" style="margin-top:12px">Your order has been marked delivered. Please confirm that you received it.</div><button class="primary" style="width:100%;margin-top:8px" onclick="confirmDelivery('${o.id}')">Confirm Delivery & Complete Order</button>`:''}</div>`;$('modal').classList.remove('hidden')}
async function confirmDelivery(id){if(!confirm('Confirm that you received this order?'))return;const r=await sb.rpc('confirm_online_delivery',{p_order:id});if(r.error)return alert(r.error.message);closeModal();await loadOrders();alert('Delivery confirmed. Order is now complete.')}
function startOrderRealtime(){if(!sb||!selectedPharmacy)return;if(window.orderChannel)sb.removeChannel(window.orderChannel);window.orderChannel=sb.channel('customer-orders').on('postgres_changes',{event:'*',schema:'public',table:'online_orders',filter:`customer_id=eq.${session.user.id}`},()=>loadOrders()).subscribe()}
function showSection(which){$('shopSection').classList.toggle('hidden',which!=='shop');$('ordersSection').classList.toggle('hidden',which!=='orders');$('shopNav').classList.toggle('active',which==='shop');if(which==='orders')loadOrders()}
function openAccount(){if(!customer)return;openCustom('My Account',`<form class="form" onsubmit="saveAccount(event)"><label>Full Name</label><input id="aName" value="${esc(customer.full_name||'')}"><label>Phone</label><input id="aPhone" value="${esc(customer.phone||'')}"><label>Address</label><textarea id="aAddress">${esc(customer.address||'')}</textarea><div class="row"><button class="primary">Save</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div></form>`)}function openCustom(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.remove('hidden')}async function saveAccount(e){e.preventDefault();const r=await sb.from('customer_profiles').update({full_name:$('aName').value.trim(),phone:$('aPhone').value.trim(),address:$('aAddress').value.trim(),updated_at:new Date().toISOString()}).eq('id',session.user.id);if(r.error)return alert(r.error.message);customer={...customer,full_name:$('aName').value.trim(),phone:$('aPhone').value.trim(),address:$('aAddress').value.trim()};closeModal();alert('Account updated.')}
async function logout(){if(!confirm('Log out of PharmaPlus?'))return;if(window.orderChannel)sb.removeChannel(window.orderChannel);await sb.auth.signOut();session=customer=null;cart=[];ordersCache=[];$('app').classList.add('hidden');$('landing').classList.remove('hidden');renderCart()}function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('pp_theme',document.body.classList.contains('dark')?'dark':'light')}function changePharmacy(){selectedPharmacy=$('pharmacy').value;cart=[];loadCatalog()}function closeModal(){$('modal').classList.add('hidden');$('modalBody').innerHTML=''}
if(localStorage.getItem('pp_theme')==='dark')document.body.classList.add('dark');init();
</script></body></html>
